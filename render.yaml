# Render Blueprint: PostGIS database, the API, and the web app. Deploy via Dashboard > New > Blueprint.
# After the first deploy, set VITE_API_URL (web) to the API's https URL and CORS_ORIGINS (API) to the web app's URL.
databases:
  - name: opencamp-db
    plan: free
    databaseName: opencamp

services:
  - type: web
    name: opencamp-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/campsites
    envVars:
      - key: DB_HOST
        fromDatabase: { name: opencamp-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: opencamp-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: opencamp-db, property: database }
      - key: DB_USER
        fromDatabase: { name: opencamp-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: opencamp-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: opencamp-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
