# Local stack: PostGIS + backend. Run: JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: opencamp
      POSTGRES_USER: opencamp
      POSTGRES_PASSWORD: opencamp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencamp -d opencamp"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/opencamp
      DB_USER: opencamp
      DB_PASSWORD: opencamp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random value of at least 32 bytes}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
