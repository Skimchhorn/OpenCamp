spring:
  application:
    name: opencamp
  datasource:
    # Either DB_URL (full JDBC URL) or the DB_HOST/DB_PORT/DB_NAME parts, which is how most hosts expose them.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencamp}}
    username: ${DB_USER:${USER}}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    # RFC 9457 bodies, so clients get our ResponseStatusException reasons as "detail".
    problemdetails:
      enabled: true
  flyway:
    # Fresh hosted databases have PostGIS available but not enabled; migrations need it.
    init-sqls: CREATE EXTENSION IF NOT EXISTS postgis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

opencamp:
  jwt:
    # HMAC-SHA256 key, at least 32 bytes. Required; never commit a real value.
    secret: ${JWT_SECRET}
    ttl: 24h
  upload-dir: ${UPLOAD_DIR:uploads}
  # Browser origins allowed to call the API (web app, Expo web).
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
