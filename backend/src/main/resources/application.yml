spring:
  application:
    name: opencamp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opencamp}
    username: ${DB_USER:${USER}}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

opencamp:
  jwt:
    # HMAC-SHA256 key, at least 32 bytes. Required; never commit a real value.
    secret: ${JWT_SECRET}
    ttl: 24h
  upload-dir: ${UPLOAD_DIR:uploads}
  # Browser origins allowed to call the API (web app, Expo web).
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
